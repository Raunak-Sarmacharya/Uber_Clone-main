name: uber_driver_app
description: uber driver app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"


dependencies:
  flutter:
    sdk: flutter

  #ui
  lottie: ^2.7.0
  cupertino_icons: ^1.0.4
  image_picker: ^1.0.5
  font_awesome_flutter: ^10.6.0
  flutter_launcher_icons: ^0.13.1

  #state management
  flutter_bloc: ^8.0.1
  equatable: ^2.0.3
  get: ^4.6.1

  #firebase
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6

  #map
  google_maps_flutter: ^2.1.1
  geolocator: ^10.1.0
  flutter_polyline_points: ^2.0.0

  # dependency injection
  get_it: ^7.2.0
  intl: ^0.19.0

  #rxdart
  rxdart: ^0.27.3
  modal_bottom_sheet: ^2.0.0

  #network connectivity
  connectivity_plus: ^5.0.2

  # for calling
  flutter_phone_direct_caller: ^2.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:

  uses-material-design: true


  assets:
    - assets/
dependency_overrides:
  test_api: 0.7.0
  uuid: 4.3.1
  web: 0.4.0
  matcher: 0.12.16+1
  material_color_utilities: 0.8.0
  meta: 1.11.0
  path: 1.9.0


